{% if can_mark_complete %}<div class="completion-control">{% if is_completed %}<span class="badge success">✓ 已完成這題</span>{% endif %}<form method="post" action="{% url 'mark_completion' problem.pk %}">{% csrf_token %}{% if record %}<input type="hidden" name="return_submission" value="{{ record.pk }}">{% endif %}{% if is_completed %}<button type="submit" class="button-quiet" name="state" value="incomplete">取消完成標記</button>{% else %}<button type="submit" class="button-outline" name="state" value="complete">✓ 標記已完成</button>{% endif %}</form></div>{% endif %}
