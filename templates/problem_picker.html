<form action="{% url 'choose_problem' %}" method="get" class="problem-switcher" data-picker>
<label class="sr-only" for="topic-search">搜尋題號或名稱</label><input type="search" id="topic-search" placeholder="搜尋題號或名稱" data-search autocomplete="off">
<label class="sr-only" for="topic-filter">完成狀態</label><select id="topic-filter" data-filter><option value="all">全部題目</option><option value="todo">未完成</option><option value="done">已完成</option></select>
<label class="sr-only" for="track-filter">主題路線</label><select id="track-filter" data-track-filter><option value="">所有主題</option>{% for track in learning_tracks %}<option value="{{ track.slug }}" {% if selected_track == track.slug %}selected{% endif %}>{{ track.name }}</option>{% endfor %}<option value="other">其他練習</option></select>
<label for="problem-select" class="sr-only">選擇 CPE 題目</label><select id="problem-select" name="problem" required data-topics><option value="" {% if not problem %}selected{% endif %}>請選擇題目</option>{% for p in problems %}<option value="{{ p.pk }}" data-track="{{ p.track_slug }}" data-done="{% if p.pk in completed_ids %}yes{% else %}no{% endif %}" {% if p.pk == problem.pk %}selected{% endif %}>{% if p.pk in completed_ids %}✓ 已完成 · {% endif %}{{ p.title }}</option>{% endfor %}</select><button type="submit">開啟題目</button><small data-matches role="status"></small></form>
