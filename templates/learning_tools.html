<details class="thinking-notes"><summary>我的思考筆記 <small>僅保存在此瀏覽器</small></summary><label for="thinking-notes">先寫下你的理解，不必急著寫程式</label><textarea id="thinking-notes" rows="7" maxlength="5000" placeholder="輸入與輸出是什麼？&#10;我想到的步驟：&#10;需要檢查的邊界情況："></textarea><small id="notes-status" role="status">筆記不會送給模型。</small></details>
{% if current_track %}<div class="route-context"><span class="eyebrow">目前學習路線</span><strong>{{ current_track.name }}</strong><p>{{ current_track.done }} / {{ current_track.total }} 題已標記完成</p><a href="{% url 'index' %}?track={{ current_track.slug }}#practice-picker">回到這個題組 →</a>{% if is_completed and current_track.next %}<a href="{% url 'practice' current_track.next.pk %}">練習下一道未完成題 →</a>{% endif %}</div>{% endif %}
